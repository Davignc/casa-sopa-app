[project]
name = "casa-sopa"
version = "0.1.0"
description = "API de gestão de vendas da Casa da Sopa de Restinga"
authors = [
    { name = "Davignc", email = "davigncc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "bcrypt>=4.2,<6",
    "fastapi[standard]>=0.141.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0.52",
    "tzdata>=2026.3",
]

[tool.uv]
# Aplicação (não biblioteca): não há pacote a construir/instalar.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations são geradas pelo Alembic; não vale brigar com o estilo delas.
"alembic/versions/*" = ["E501", "UP007", "UP035"]
# Testes têm tabelas de dados longas; legibilidade vale mais que o limite de colunas.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.38.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
